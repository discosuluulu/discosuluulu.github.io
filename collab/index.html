<!DOCTYPE html>

<head>

  <title>Collabs – Discosuluulu</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: url('madera.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    section {
      scroll-snap-align: start;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      background-color: rgba(0, 0, 0, 0.4); /* slight dark overlay for text visibility */
    }

    .collab-title {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .collab-title a {
      color: #fff;
      text-decoration: none;
    }

    .collab-title a:hover {
      text-decoration: underline;
    }

    .collab-image {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }

    .collab-image:hover {
      transform: scale(1.02);
    }

    @media (max-width: 600px) {
      .collab-title {
        font-size: 1.1rem;
      }

      .collab-image {
        max-width: 95%;
      }
    }
  </style>
</head>
