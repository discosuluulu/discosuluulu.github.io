<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discos Uluulu - Vinyl Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="vinyl-room">
    <!-- Vinyl 1 -->
    <div class="vinyl-item">
      <img src="https://via.placeholder.com/300x300.png?text=Vinyl+1" class="vinyl-cover" alt="Vinyl 1">
      <div class="vinyl-info">
        <h2>Artist – Album One</h2>
        <p>Genre: Tropicalia, Lo-fi Psych</p>
        <button onclick="buyVinyl('vinyl1')">Buy Now</button>
      </div>
    </div>

    <!-- Vinyl 2 -->
    <div class="vinyl-item">
      <img src="https://via.placeholder.com/300x300.png?text=Vinyl+2" class="vinyl-cover" alt="Vinyl 2">
      <div class="vinyl-info">
        <h2>Artist – Album Two</h2>
        <p>Genre: Cosmic Folk, Analog Funk</p>
        <button onclick="buyVinyl('vinyl2')">Buy Now</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
