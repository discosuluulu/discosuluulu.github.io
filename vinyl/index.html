<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disco Suluulu Vinyl Shop</title>
  <script async src="https://js.stripe.com/v3/buy-button.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('wood-floor.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Georgia', serif;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 40px;
      background: rgba(255, 255, 255, 0.6);
      padding: 10px;
      border-radius: 6px;
      display: inline-block;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
    }

    .vinyl {
      width: 300px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .vinyl:hover {
      transform: scale(1.03);
    }

    .vinyl img {
      width: 100%;
      border: 6px solid #eee;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .details {
      display: none;
      margin-top: 40px;
      background: rgba(255, 255, 255, 0.85);
      padding: 20px;
      border-radius: 8px;
    }

    .details.active {
      display: block;
    }

    .details h2 {
      margin-top: 0;
    }

    .images {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }

    .images img {
      width: 180px;
      border: 4px solid #ddd;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
    }

    stripe-buy-button {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Disco Suluulu Vinyl Shop</h1>

    <div class="grid">
      <!-- Garden de la Selva -->
      <div class="vinyl" onclick="showDetails('gdls')">
        <img src="gardendelaselva vinyl.jpg" alt="Garden de la Selva vinyl">
      </div>

      <!-- Otucan -->
      <div class="vinyl" onclick="showDetails('otucan')">
        <img src="Otucan.jpg" alt="Otucan vinyl">
      </div>
    </div>

    <!-- Details Section: Garden de la Selva -->
    <div id="details-gdls" class="details">
      <h2>Garden de la Selva</h2>
      <div class="images">
        <img src="gdlsback.jpg" alt="Back cover">
        <img src="gdslaside.jpg" alt="A side label">
        <img src="gdslbside.jpg" alt="B side label">
      </div>
      <p>Experience Garden de la Selva — lush soundscapes rooted in analog warmth. Limited pressing.</p>
      <stripe-buy-button
        buy-button-id="buy_btn_1RfmtwKOS6jarVmAZEcGpCiU"
        publishable-key="pk_live_51RP7SwKOS6jarVmA2T08AsewL44IvEhHhiwPMJMPIUnr90eUgLc3ISmuHWnjOUWjU6w4ZO3PLy5u8mQz29YZBG1m00FlZRi1lw">
      </stripe-buy-button>
    </div>

    <!-- Details Section: Otucan -->
    <div id="details-otucan" class="details">
      <h2>Otucan</h2>
      <div class="images">
        <img src="otucanback.jpg" alt="Back cover">
        <img src="otucanaside.jpg" alt="A side label">
        <img src="otucanbside.jpg" alt="B side label">
      </div>
      <p>Otucan is an analog journey into mysticism and rhythm. Sustainably pressed, sonically rich.</p>
      <stripe-buy-button
        buy-button-id="buy_btn_1Rfn9bKOS6jarVmAljasKKpA"
        publishable-key="pk_live_51RP7SwKOS6jarVmA2T08AsewL44IvEhHhiwPMJMPIUnr90eUgLc3ISmuHWnjOUWjU6w4ZO3PLy5u8mQz29YZBG1m00FlZRi1lw">
      </stripe-buy-button>
    </div>
  </div>

  <script>
    function showDetails(id) {
      document.querySelectorAll('.details').forEach(d => d.classList.remove('active'));
      const section = document.getElementById('details-' + id);
      if (section) {
        section.classList.add('active');
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  </script>
</body>
</html>
